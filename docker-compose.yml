services:
  gridsight:
    build: .
    image: gridsight:latest
    container_name: gridsight
    ports:
      - "3000:3000"
    # Runtime-only credentials: never bake secrets into the image.
    # .env.local is OPTIONAL: a fresh clone with no .env.local starts fine
    # and can reach the sample report (POST /api/demo-session, zero inference).
    # Create .env.local with MODEL_API_KEY only when enabling live inference.
    # `required: false` needs Docker Compose v2.24.0 or later (Compose Specification).
    env_file:
      - path: .env.local
        required: false
    environment:
      GRIDSIGHT_TMP_DIR: /tmp/opencode/gridsight
    volumes:
      # Persists SQLite (gridsight.db), uploaded video/audio, frames, and report JSON.
      # Must match src/lib/store.ts scratchDir() + dbPathFor().
      - gridsight-data:/tmp/opencode/gridsight
      # Frozen demo fixtures (USE_CACHED sample mode) ship in the image already;
      # mount local fixtures only for development.
      # - ./fixtures:/app/fixtures:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  gridsight-data:
    name: gridsight-data
